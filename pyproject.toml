[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tib27-hjem"
version = "0.1.0"
description = "Home Assistant-konfiguration og IHC-værktøjer for TIB27"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tib27-ihc = "tib27_ihc.__main__:main"

[tool.setuptools]
package-dir = { "" = "ihc" }
packages = ["tib27_ihc"]

[tool.pytest.ini_options]
testpaths = ["ihc/tests", "tests"]
addopts = "-q"

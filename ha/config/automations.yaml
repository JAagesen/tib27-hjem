- id: hue_ihc_verner_tv
  alias: Store Stue - Verner til 5 pct naar TV-scenariet saettes
  mode: single
  trigger:
  - platform: state
    entity_id: sensor.stue_scenarie_status
    to: TV
    id: tv_til
  - platform: state
    entity_id: sensor.stue_scenarie_status
    from: TV
    id: tv_fra
  condition:
  - condition: state
    entity_id: light.stue
    state: 'on'
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: tv_til
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.stue
        data:
          brightness_pct: 5
          transition: 2
    - conditions:
      - condition: trigger
        id: tv_fra
      - condition: template
        value_template: '{{ trigger.to_state.state not in [''unavailable'',''unknown'']
          and trigger.to_state.state | trim != ''Fuldt Lys'' }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.stue
        data:
          brightness_pct: 30
          transition: 2
- id: hue_ihc_verner_fuldt_lys
  alias: Store Stue (Verner) - 100 pct naar Fuldt lys (rengoering) saettes
  description: Naar stuens scenarie saettes til Fuldt Lys gaar Verner paa 100 pct,
    saa han foelger resten af stuen. Forlades scenariet igen, gaar han tilbage til
    30 pct - undtagen ved skift til TV eller Slukket, som har deres egne automationer.
  mode: single
  trigger:
  - platform: state
    entity_id: sensor.stue_scenarie_status
  condition:
  - condition: template
    value_template: "{{ trigger.from_state is not none and trigger.to_state is not
      none\n   and trigger.from_state.state not in ['unavailable','unknown']\n   and
      trigger.to_state.state not in ['unavailable','unknown']\n   and (trigger.from_state.state
      | trim) != (trigger.to_state.state | trim) }}"
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state | trim == ''Fuldt Lys'' }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.stue
        data:
          brightness_pct: 100
          transition: 2
    - conditions:
      - condition: template
        value_template: "{{ trigger.from_state.state | trim == 'Fuldt Lys'\n   and
          (trigger.to_state.state | trim) not in ['TV','Slukket'] }}"
      - condition: state
        entity_id: light.stue
        state: 'on'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.stue
        data:
          brightness_pct: 30
          transition: 2

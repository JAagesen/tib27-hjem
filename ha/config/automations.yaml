- id: hue_ihc_sov_alt_op
  alias: Sovevaerelset - oeverst venstre (alt lys / op)
  mode: restart
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.sov_dor_op_v
    - binary_sensor.sov_miv_op_v
    - binary_sensor.sov_nalle_op_v
    to: 'on'
  action:
  - wait_template: '{{ is_state(trigger.entity_id, ''off'') }}'
    timeout:
      seconds: 0.4
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_state(trigger.entity_id, ''off'') }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.sovevaerelse
        data:
          transition: 1
          brightness_pct: 80
    default:
    - repeat:
        while:
        - condition: template
          value_template: '{{ is_state(trigger.entity_id, ''on'') }}'
        - condition: template
          value_template: '{{ repeat.index <= 40 }}'
        sequence:
        - service: light.turn_on
          target:
            entity_id: light.sovevaerelse
          data:
            brightness_step_pct: 10
            transition: 0.4
        - delay:
            seconds: 0.4

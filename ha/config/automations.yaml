- id: '1790438146726'
  alias: IHC vagthund – hjerteslag
  description: Genstarter Home Assistant, hvis hjerteslaget fra IHC (ressource 8588042)
    ikke har ændret sig i 15 minutter. Flaget kipper hvert 2:30, så 15 minutter svarer
    til seks mistede slag.
  triggers:
  - trigger: state
    entity_id: binary_sensor.ha_hjerteslag
    to: 'on'
    for: 00:15:00
  - trigger: state
    entity_id: binary_sensor.ha_hjerteslag
    to: 'off'
    for: 00:15:00
  - trigger: state
    entity_id: binary_sensor.ha_hjerteslag
    to: unavailable
    for: 00:15:00
  conditions:
  - condition: template
    value_template: '{% set lt = state_attr(this.entity_id, ''last_triggered'') %}
      {{ lt is none or (now() - lt).total_seconds() > 3600 }}'
  actions:
  - action: notify.mobile_app_jan_s_s22_via_app
    data:
      title: IHC er tavs
      message: Intet hjerteslag fra IHC i 15 minutter. Home Assistant genstarter nu.
  - action: persistent_notification.create
    data:
      title: IHC vagthund
      message: Intet hjerteslag fra IHC i 15 minutter. Home Assistant genstartes.
  - delay:
      seconds: 10
  - action: homeassistant.restart
  mode: single
- id: '1790540794551'
  alias: Opdater Home Assistant automatisk – første søndag i måneden
  description: Installerer ny Home Assistant Core den første søndag i måneden kl.
    04, hvis der er en opdatering klar. Der tages altid en sikkerhedskopi først.
  triggers:
  - trigger: time
    at: 04:00:00
  conditions:
  - condition: template
    value_template: '{{ now().day <= 7 and now().weekday() == 6 }}'
  - condition: state
    entity_id: update.home_assistant_core_update
    state: 'on'
  actions:
  - action: notify.mobile_app_jan_s_s22_via_app
    data:
      title: Home Assistant opdaterer
      message: Ny udgave {{ state_attr('update.home_assistant_core_update', 'latest_version')
        }} installeres nu. Sikkerhedskopi tages først.
  - action: update.install
    target:
      entity_id: update.home_assistant_core_update
    data:
      backup: true
  mode: single
- id: hue_ihc_verner_onoff
  alias: Store Stue (Verner) - Hue taend/sluk fra IHC-tryk
  mode: single
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.stue_tryk_on_gangdor
    - binary_sensor.stue_tryk_on_faelles
    - binary_sensor.stue_tryk_on_soterr
    - binary_sensor.stue_tryk_on_fjern1
    - binary_sensor.stue_tryk_on_klaver
    - binary_sensor.stue_tryk_on_gangdor_ned
    - binary_sensor.stue_tryk_on_klaver_ned
    - binary_sensor.stue_tryk_on_fjern5
    to: 'on'
    id: taend
  - platform: state
    entity_id:
    - binary_sensor.stue_tryk_off_gangdor
    - binary_sensor.stue_tryk_off_faelles
    - binary_sensor.stue_tryk_off_soterr
    - binary_sensor.stue_tryk_off_fjern2
    - binary_sensor.stue_tryk_off_klaver
    - binary_sensor.stue_tryk_off_gangdor_ned
    - binary_sensor.stue_tryk_off_klaver_ned
    - binary_sensor.stue_tryk_off_fjern6
    - binary_sensor.stue_tryk_off_fjern8
    - binary_sensor.stue_tryk_off_soterr_ned
    to: 'on'
    id: sluk
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: taend
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.stue
        data:
          transition: 1
          brightness_pct: '{{ 5 if states(''sensor.stue_scenarie_status'') | trim
            == ''TV'' else 30 }}'
    - conditions:
      - condition: trigger
        id: sluk
      sequence:
      - service: light.turn_off
        target:
          entity_id: light.stue
        data:
          transition: 1

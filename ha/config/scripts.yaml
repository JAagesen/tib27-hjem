all_lights_off:
  alias: "All Lights Off"
  sequence:
    - service: light.turn_off
      target:
        entity_id: light.slukalt
    - delay:
        milliseconds: 100
    - service: light.turn_on
      target:
        entity_id: light.slukalt
    - delay:
        milliseconds: 100
    - service: light.turn_off
      target:
        entity_id: light.slukalt
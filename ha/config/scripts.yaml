  sequence:
  - type: turn_on
    device_id: 09af2500ce663d660dd0ddb6299ee3ed
    entity_id: 0ac1142039e6acc75002d7e58113013d
    domain: switch
  - device_id: 3fb7bd703411635ba310678723ddd926
    domain: climate
    entity_id: 4d407c92b0aba67c159d70b876ad80dd
    type: set_hvac_mode
    hvac_mode: heat
  mode: single
  icon: mdi:heat-wave

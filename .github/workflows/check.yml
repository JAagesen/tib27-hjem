name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Tests
        run: pytest
      - name: Home Assistant-regler
        run: python tools/check_ha.py
      - name: Projektfiler
        run: |
          shopt -s nullglob
          files=(ihc/project/*.vis)
          [ ${#files[@]} -eq 0 ] && { echo "ingen .vis-filer endnu"; exit 0; }
          for f in "${files[@]}"; do tib27-ihc verify "$f"; done
